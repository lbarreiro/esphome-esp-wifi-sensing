# Pacote ESPHome do XIAO ESP32-C6 com MVS3.
# A configuração específica da instalação (nome, threshold, Wi-Fi e API)
# fica no YAML local.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Laboratorio de experiências nucleares
  # XIAO ESP32-C6:
  # GPIO3 LOW  -> ativa o controlo do RF switch
  # GPIO14 HIGH -> seleciona a antena externa (U.FL)
  on_boot:
    priority: 800
    then:
      - output.turn_off: rf_switch_power
      - delay: 100ms
      - output.turn_on: rf_switch_select

# Registo temporário em RAM das ativações MVS1/MVS3. Cada linha só é fechada
# quando o respetivo sensor passa a OFF; os dados não são escritos na flash.
globals:
  - id: mvs1_episode_start_epoch
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: mvs1_episode_start_iso
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mvs3_episode_start_epoch
    type: int64_t
    restore_value: no
    initial_value: '0'
  - id: mvs3_episode_start_iso
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mvs_csv_data
    type: std::string
    restore_value: no
    initial_value: '"inicio,fim,sensor,duracao_s\n"'
  - id: mvs_csv_snapshot
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mvs_csv_filename
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: mvs_csv_uploading
    type: bool
    restore_value: no
    initial_value: 'false'

# A hora local vem do Home Assistant e segue Europe/Lisbon, incluindo a hora
# de verão. O CSV é enviado como anexo às 12:00.
time:
  - platform: homeassistant
    id: mvs_daily_log_clock
    timezone: Europe/Lisbon
    on_time:
      - seconds: 0
        minutes: 0
        hours: 12
        then:
          - if:
              condition:
                lambda: |-
                  return id(mvs_daily_log_clock).now().is_valid() &&
                         !id(mvs_csv_uploading);
              then:
                - lambda: |-
                    auto now = id(mvs_daily_log_clock).now();
                    id(mvs_csv_snapshot) = id(mvs_csv_data);
                    id(mvs_csv_filename) =
                        "mvs-comparacao-" + now.strftime("%Y-%m-%d") + ".csv";
                    id(mvs_csv_uploading) = true;
                    ESP_LOGI("mvs_log", "A enviar anexo %s (%u bytes)",
                             id(mvs_csv_filename).c_str(),
                             static_cast<unsigned>(id(mvs_csv_snapshot).size()));
                - http_request.send:
                    method: PUT
                    url: https://ntfy.lbarreiro.net/csi
                    request_headers:
                      Filename: !lambda |-
                        return id(mvs_csv_filename).c_str();
                      Content-Type: text/csv; charset=utf-8
                    body: !lambda |-
                      return id(mvs_csv_snapshot);
                    on_response:
                      then:
                        - lambda: |-
                            if (response->status_code >= 200 && response->status_code < 300) {
                              const std::string header = "inicio,fim,sensor,duracao_s\n";
                              auto &buffer = id(mvs_csv_data);
                              const auto &sent = id(mvs_csv_snapshot);
                              if (buffer.size() >= sent.size() &&
                                  buffer.compare(0, sent.size(), sent) == 0) {
                                buffer.erase(0, sent.size());
                                buffer.insert(0, header);
                              } else {
                                ESP_LOGE("mvs_log", "CSV enviado, mas não foi possível separar o bloco enviado da RAM");
                              }
                              ESP_LOGI("mvs_log", "Anexo CSV aceite pelo ntfy: HTTP %d",
                                       response->status_code);
                              id(mvs_csv_snapshot).clear();
                            } else {
                              ESP_LOGE("mvs_log", "Falha no envio do CSV: HTTP %d; dados mantidos em RAM",
                                       response->status_code);
                            }
                            id(mvs_csv_uploading) = false;
                    on_error:
                      then:
                        - lambda: |-
                            ESP_LOGE("mvs_log", "Falha de ligação ao ntfy; dados mantidos em RAM");
                            id(mvs_csv_uploading) = false;
              else:
                - logger.log:
                    level: WARN
                    format: "Envio CSV às 12:00 não iniciado: hora inválida ou envio anterior em curso"

http_request:
  verify_ssl: true

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf
    components:
      - espressif/esp-radar==0.3.4
    sdkconfig_options:
      CONFIG_LWIP_IPV6: "y"
      CONFIG_ESP_WIFI_CSI_ENABLED: "y"
    advanced:
      flash_chip: generic

external_components:
  - source:
      type: git
      url: https://github.com/lbarreiro/esphome-esp-wifi-sensing
      ref: a28364b54046cb236e993ba016b6474b585d7a05
    components: [esp_wifi_sensing]
    refresh: 1d

esp_wifi_sensing:
  id: wifi_sensing
  algorithm: mvs
  threshold: ${mvs_threshold}
  gain_compensation: false
  motion_hold_time: 120s
  filter_window: 8
  filter_count: 3
  update_interval: 100ms
  quiet_boot_samples: 20
  quiet_alpha: 0.01
  quiet_update_limit: 3.0
  ping_interval: 100ms

# Controlo do RF switch do XIAO ESP32-C6
output:
  - platform: gpio
    pin: GPIO3
    id: rf_switch_power
  - platform: gpio
    pin: GPIO14
    id: rf_switch_select

switch:
  - platform: gpio
    id: motion_led
    pin:
      number: GPIO15
      inverted: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: esp_wifi_sensing
    esp_wifi_sensing_id: wifi_sensing
    motion:
      id: motion_detected
      name: "CSI Motion"
      on_state:
        then:
          - if:
              condition:
                binary_sensor.is_on: motion_detected
              then:
                - switch.turn_on: motion_led
              else:
                - switch.turn_off: motion_led
          - lambda: |-
              auto now = id(mvs_daily_log_clock).now();
              if (!now.is_valid()) {
                ESP_LOGW("mvs_log", "MVS1 mudou de estado sem hora sincronizada; evento não registado");
                return;
              }
              if (id(motion_detected).state) {
                if (id(mvs1_episode_start_epoch) == 0) {
                  id(mvs1_episode_start_epoch) = static_cast<int64_t>(now.timestamp);
                  id(mvs1_episode_start_iso) = now.strftime("%Y-%m-%dT%H:%M:%S%z");
                }
                return;
              }
              if (id(mvs1_episode_start_epoch) == 0) return;
              const int64_t duration = static_cast<int64_t>(now.timestamp) -
                                       id(mvs1_episode_start_epoch);
              if (duration >= 0) {
                id(mvs_csv_data) += id(mvs1_episode_start_iso) + "," +
                    now.strftime("%Y-%m-%dT%H:%M:%S%z") + ",MVS1," +
                    std::to_string(static_cast<long long>(duration)) + "\n";
              } else {
                ESP_LOGW("mvs_log", "Hora recuou durante episódio MVS1; evento descartado");
              }
              id(mvs1_episode_start_epoch) = 0;
              id(mvs1_episode_start_iso).clear();
    motion_3:
      name: "CSI Motion 256 Learned"
      id: csi_movimento_3
      on_state:
        then:
          - lambda: |-
              auto now = id(mvs_daily_log_clock).now();
              if (!now.is_valid()) {
                ESP_LOGW("mvs_log", "MVS3 mudou de estado sem hora sincronizada; evento não registado");
                return;
              }
              if (id(csi_movimento_3).state) {
                if (id(mvs3_episode_start_epoch) == 0) {
                  id(mvs3_episode_start_epoch) = static_cast<int64_t>(now.timestamp);
                  id(mvs3_episode_start_iso) = now.strftime("%Y-%m-%dT%H:%M:%S%z");
                }
                return;
              }
              if (id(mvs3_episode_start_epoch) == 0) return;
              const int64_t duration = static_cast<int64_t>(now.timestamp) -
                                       id(mvs3_episode_start_epoch);
              if (duration >= 0) {
                id(mvs_csv_data) += id(mvs3_episode_start_iso) + "," +
                    now.strftime("%Y-%m-%dT%H:%M:%S%z") + ",MVS3," +
                    std::to_string(static_cast<long long>(duration)) + "\n";
              } else {
                ESP_LOGW("mvs_log", "Hora recuou durante episódio MVS3; evento descartado");
              }
              id(mvs3_episode_start_epoch) = 0;
              id(mvs3_episode_start_iso).clear();
    top3:
      name: "MVS3 TOP3"
      entity_category: diagnostic

sensor:
  - platform: esp_wifi_sensing
    esp_wifi_sensing_id: wifi_sensing
    ultima_minutos:
      name: "MVS3 Ultima confirmacao"
      entity_category: diagnostic
    portadora_mais_fraca:
      name: "MVS3 Portadora mais fraca"
      entity_category: diagnostic

text_sensor:
  - platform: esp_wifi_sensing
    esp_wifi_sensing_id: wifi_sensing
    via:
      name: "MVS3 Via"
      entity_category: diagnostic
    portadoras_top:
      name: "MVS3 Portadoras Top"
      entity_category: diagnostic
    top_classificacao:
      name: "MVS3 TOP Classificacao"
      entity_category: diagnostic

logger:
  level: DEBUG
