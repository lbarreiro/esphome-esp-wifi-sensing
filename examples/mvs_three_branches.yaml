esphome:
  name: wifi-sensing-three-branches
  friendly_name: WiFi Sensing MVS Reference and Learned

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ../components
    components: [esp_wifi_sensing]

esp_wifi_sensing:
  id: wifi_sensing
  algorithm: mvs
  gain_compensation: false
  threshold: 8.0
  filter_window: 8
  filter_count: 3
  update_interval: 100ms
  quiet_boot_samples: 20
  quiet_alpha: 0.01
  quiet_update_limit: 3.0
  motion_hold_time: 120s
  ping_interval: 100ms

binary_sensor:
  - platform: esp_wifi_sensing
    esp_wifi_sensing_id: wifi_sensing
    motion:
      name: CSI Motion 256 Reference
    motion_3:
      name: CSI Motion 256 Learned
    top3:
      name: "MVS3 TOP3"
      entity_category: diagnostic

sensor:
  - platform: esp_wifi_sensing
    esp_wifi_sensing_id: wifi_sensing
    ultima_minutos:
      name: "MVS3 Ultima confirmacao"
      entity_category: diagnostic
    portadora_mais_fraca:
      name: "MVS3 Portadora mais fraca"
      entity_category: diagnostic

text_sensor:
  - platform: esp_wifi_sensing
    esp_wifi_sensing_id: wifi_sensing
    via:
      name: "MVS3 Via"
      entity_category: diagnostic
    portadoras_top:
      name: "MVS3 Portadoras Top"
      entity_category: diagnostic
